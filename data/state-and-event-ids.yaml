    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P6-INTEL-TARGETS, FRAG-RULE-0910-2-PDF-P15-CYBER-DOMINANCE, FRAG-RULE-0910-2-PDF-P16-IMMEDIATE-PUBLIC-DISPLAY]
    status: reviewed
  - state_id: STATE-SQUADRON-PLATE-DEPLOYMENT
    name_ja: スコードロンプレート配備状態
    visibility: owner_only_until_acquired
    owner_content: [component_id, plate_id, plate_identity, base_group_id, deployed]
    public_content: []
    hidden_from_opponent: [component_id, plate_id, plate_identity, base_group_id, deployed]
    identity_reveal_state_id: STATE-SQUADRON-ACQUIRED
    value_type: record
    allowed_values: { component_id: COMP-SQUADRON-*, base_group_id: base_group_id, deployed: boolean }
    persistence: persistent_across_ATO_unless_removed_by_rule
    rule_core_ids: [RC-SQUADRON-DEPLOYMENT-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P19-SCENARIO1-PRC-DAY1-SQUADRONS, FRAG-RULE-0910-2-DOCX-P536-541-SCENARIO1-PRC-DAY1-SQUADRONS, FRAG-BOARD-A3-0915-ENTIRE]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-SQUADRON-TOKEN-CUSTODY
    name_ja: スコードロン由来token所在状態
    visibility: field_level_with_public_aggregate
    owner_content: [token_id, source_plate_id, zone, hex_id]
    public_content: [token_count, placement_hex_ids, return_from_hex_ids]
    hidden_from_opponent: [token_id, source_plate_id, token_to_source_plate_mapping]
    identity_reveal_state_id: STATE-SQUADRON-ACQUIRED
    public_projection: 個別token recordを直接公開せず、盤上配置数・配置hex又は帰還数・帰還元hexを公開する。
    value_type: record_per_physical_token
    allowed_values: { zone: [token_pool, map, removed_tray], hex_id: string_or_not_applicable, source_plate_id: COMP-SQUADRON-* }
    persistence: persistent
    rule_core_ids: [RC-SQUADRON-GENERATION-001, RC-SQUADRON-RETURN-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-TOKEN-0901-1-P5-6-KJ-500, FRAG-TOKEN-0901-1-P5-6-KQ-200]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-COMMAND-STARS-AVAILABLE
    name_ja: 使用可能★数
    visibility: owner_only_with_public_transaction_events
    owner_content: [available_star_count]
    public_content: []
    hidden_from_opponent: [available_star_count]
    value_type: integer
    allowed_values: 0..40_per_faction_subject_to_other_approved_rules
    persistence: persistent_resource_state
    rule_core_ids: [RC-SQUADRON-ACTIVATION-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-BOARD-A3-0915-ENTIRE]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-BASE-SORTIE-CAPACITY
    name_ja: 基地群出撃キャパシティ状態
    visibility: public
    public_content: [base_group_id, effective_capacity, committed_cost, remaining_capacity]
    owner_content: [base_group_id, effective_capacity, committed_cost, remaining_capacity]
    hidden_from_opponent: []
    value_type: record_per_base_group
    allowed_values: { effective_capacity: non_negative_integer, committed_cost: non_negative_integer, remaining_capacity: derived_non_negative_integer }
    persistence: persistent_during_ATO_committed_stars_return_at_ATO_end
    rule_core_ids: [RC-SQUADRON-ACTIVATION-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-BOARD-A3-0915-ENTIRE, FRAG-BOARD-A4-0815-01-ENTIRE]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-BASE-AIR-OPERATIONS-INFRASTRUCTURE-DAMAGE
    name_ja: 基地群航空運用インフラ被害
    visibility: public
    public_content: [base_group_id, damage_level]
    owner_content: [base_group_id, damage_level]
    hidden_from_opponent: []
    value_type: integer_damage_level_per_base_group
    allowed_values: printed_board_track_for_base_group
    persistence: persistent_affects_sortie_capacity_from_following_day
    rule_core_ids: [RC-SQUADRON-ACTIVATION-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-BOARD-A4-0815-01-ENTIRE]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-BASE-MAINTENANCE-SUPPLY-DAMAGE
    name_ja: 基地群整備補給基盤被害
    visibility: public
    public_content: [base_group_id, damage_level]
    owner_content: [base_group_id, damage_level]
    hidden_from_opponent: []
    value_type: integer_damage_level_per_base_group
    allowed_values: printed_board_track_for_base_group
    persistence: persistent_affects_token_generation_immediately
    rule_core_ids: [RC-SQUADRON-GENERATION-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-BOARD-A4-0815-01-ENTIRE]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
  - state_id: STATE-SQUADRON-ACTIVATION-IN-PROGRESS
    name_ja: スコードロンactivation進行中
    visibility: field_level
    owner_content: [plate_id, base_group_id, requested_token_count, maximum_token_count, required_star_cost, paid_star_cost, maintenance_roll, actual_generated_count, ground_abort_count]
    public_content: [requested_token_count, required_star_cost, paid_star_cost, maintenance_roll, actual_generated_count, ground_abort_count]
    hidden_from_opponent: [plate_id, base_group_id, maximum_token_count]
    identity_reveal_state_id: STATE-SQUADRON-ACQUIRED
    internal_fields_excluded: [continuation, stack, resume_token]
    value_type: temporary_structured_record
    allowed_values: { plate_id: COMP-SQUADRON-*, base_group_id: base_group_id, requested_token_count: positive_integer, maximum_token_count: positive_integer, required_star_cost: non_negative_integer, paid_star_cost: non_negative_integer, maintenance_roll: D4_or_not_yet_resolved, actual_generated_count: non_negative_integer_or_not_yet_resolved, ground_abort_count: non_negative_integer_or_not_yet_resolved }
    persistence: temporary_until_EVENT-SQUADRON-ACTIVATION-COMPLETED
    rule_core_ids: [RC-SQUADRON-ACTIVATION-001, RC-SQUADRON-GENERATION-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-RULE-0910-2-DOCX-P184-192-SQUADRON-ACTIVATION]
    decision_ids: [DEC-SQUADRON-ACTIVATION-VISIBILITY-001]
    status: reviewed
