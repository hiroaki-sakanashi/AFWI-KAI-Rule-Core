    owner_content: [MD_asset_identity, anti_air_ammunition_remaining]
    hidden_from_opponent: [MD_asset_identity]
    rule_core_ids: [RC-COMBAT-MD-001, RC-COMBAT-MD-VISIBILITY-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P12-MD, FRAG-TOKEN-0901-1-ENTIRE]
    decision_ids: [DEC-COMBAT-MD-VISIBILITY-001]
    duration: retained_as_known_information
    revoke_trigger: not_applicable
    status: reviewed
  - state_id: STATE-INTEL-CONFIRMATIONS-REMAINING
    name_ja: インテル確認可能残数
    visibility: public
    rule_core_ids: [RC-RATE-INTEL-001, RC-INTEL-ACTIVITY-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P6-INTEL-TARGETS]
