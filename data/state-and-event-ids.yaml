    rule_core_ids: [RC-COMBAT-MD-001, RC-COMBAT-MD-RESOLUTION-001, RC-COMBAT-MD-LAYERED-001, RC-COMBAT-MD-VISIBILITY-001]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P12-MD]
    decision_ids: [DEC-COMBAT-MD-VISIBILITY-001]
    duration: retained_as_known_information
    revoke_trigger: not_applicable
