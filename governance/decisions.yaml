decisions:
  - decision_id: DEC-COMBAT-MD-VISIBILITY-001
    category: addition
    owner_final_text: >-
      MDの宣言及びMDを行わないpassはBLUE・RED両陣営へ公開する。MDに使用した個別アセットidentityは
      管理陣営には既知だが、MD処理を理由として相手陣営へ追加公開しない。ただし別規則により既に公開済みのidentityを
      再秘匿しない。MD宣言時の対空弾薬1消費及び消費後残弾数は両陣営へ公開する。MD判定の生D4出目は
      防御側には既知とし、相手陣営へはMD処理を理由として公開しない。MD判定へ適用されたADV、DISその他の判定条件と、
      完全迎撃、部分迎撃又は失敗の結果は両陣営へ公開する。ただし判定条件の原因となる別の秘密情報は、
      その情報を規律する別のRule Core契約によらない限り追加公開しない。一度公開された情報は既知情報として保持し、
      MD処理終了後も再秘匿しないため、revoke triggerはnot_applicableとする。この公開契約は海軍アセットからADAへ進む
      レイヤードMDの各層へ共通適用し、第1層結果は第2層ADA response windowの前に両陣営へ公開する。
    scope: "共通MD、レイヤードMD及びMD宣言をtriggerとする即応におけるknowledge/visibility"
    affected_rule_core_ids: [RC-COMBAT-MD-001, RC-COMBAT-MD-RESOLUTION-001, RC-COMBAT-MD-LAYERED-001, RC-COMBAT-MD-VISIBILITY-001, RC-ENABLER-IMMEDIATE-001]
    source_relationship: >-
      SRC-RULE-0910-2-PDF p.12はMDの宣言、pass後の攻撃継続、弾薬消費、D4結果及びレイヤード順序を定め、
      SRC-ENABLER-0830-1 p.41はBLUEのMD宣言直後をSTC-RF-05のtriggerとする。SRC-TOKEN-0901-1はMD値と
      対空残弾表示を担うが、いずれも陣営別recipients、公開content、duration及びrevokeを十分に定めないため、
      本追加裁定が正式なゲーム意味として補う。
    normative_information:
      - "MD宣言の事実はBLUE・RED両陣営へ公開"
      - "MDを行わないpassの事実はBLUE・RED両陣営へ公開"
      - "使用MDアセットidentityは管理陣営に既知だが相手陣営へMDを理由に追加公開しない"
      - "別規則で既に公開済みのアセットidentityは再秘匿しない"
      - "対空弾薬1消費と消費後残弾数はBLUE・RED両陣営へ公開"
      - "生D4出目は防御側に既知、相手陣営へMDを理由に公開しない"
      - "適用されたADV・DISその他の判定条件はBLUE・RED両陣営へ公開"
      - "判定条件の原因となる別の秘密情報は自動公開しない"
      - "完全迎撃・部分迎撃・失敗はBLUE・RED両陣営へ公開"
      - "公開済み情報は既知として保持し、revoke triggerはnot_applicable"
      - "レイヤードMD第1層結果は第2層response window前にBLUE・RED両陣営へ公開"
    manufacturing_information_boundary: >-
      物理コンポーネントの見え方やDigitalのprojection方式を規範根拠としない。Digitalは本裁定のrecipient/content境界を
      実装するが、response stack、resume point、通信payload又はUI表示方式をRule Coreのゲーム意味へ加えない。
    source_ids: [SRC-RULE-0910-2-PDF, SRC-ENABLER-0830-1, SRC-TOKEN-0901-1]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P12-MD, FRAG-ENABLER-0830-1-STC-RF-05, FRAG-TOKEN-0901-1-ENTIRE]
    original_decided_at: "2026-09-24"
    reconfirmed_at: "2026-09-24"
