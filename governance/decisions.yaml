  - decision_id: DEC-CYBER-TARGET-GROUP-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - `cyber-target-groups.md`をAFWI-KAI Rule Coreの正式規範文書とする。
      - 同文書第1節から第5節、第7節及び第8節を規範とする。
      - 第6節のDigital mapping及び第9節の実装案は非規範とする。
      - Cyber Target Groupは陣営込みのInternal Group ID、Player Label、Included Tokensを分離して保持する。
      - 第4節のUS 16 group、PRC 17 groupを正式membershipとする。
      - 所属tokenが盤上に存在しないgroupも合法な指定対象とする。
      - 当日持続中に新たに生成された所属tokenにも、選択groupに成立済みの機能停止効果を適用する。
      - groupへの効果帰属はindividual card effect durationを変更せず、カード印字の当日終了までという期間に従う。
    scope: "US-CY-02／STC-CY-01の対象単位となるCyber Target Groupのモデル、membership、選択及び後発tokenへの適用"
    affected_rule_core_ids: [RC-CYBER-TARGET-GROUP-MODEL-001, RC-CYBER-TARGET-GROUP-MEMBERSHIP-001, RC-CYBER-TARGET-GROUP-SELECTION-001, RC-CYBER-TARGET-GROUP-PERSISTENCE-001]
    source_relationship: >-
      SRC-ENABLER-0830-1のSTC-CY-01及びUS-CY-02は敵の同一名称token 1種と当日終了までの機能停止を定める。
      SRC-SQUADRON-0901及びSRC-TOKEN-0901-1は正式コンポーネント名を提供するが、group境界、盤上不在groupの選択、
      後発tokenへの波及を一意に定めないため、本追加裁定がその範囲を確定する。
    normative_information:
      - "Cyber Target Groupの三層構造、陣営境界及び一意所属"
      - "US 16 group、PRC 17 groupの正式membership"
      - "盤上不在groupの指定可否"
      - "当日持続中の後発tokenへの適用"
      - "カード固有duration、判定、ADV／DIS及び使い切り状態は不変"
    source_ids: [SRC-ENABLER-0830-1, SRC-SQUADRON-0901, SRC-TOKEN-0901-1]
    source_fragment_ids: [FRAG-ENABLER-0830-1-STC-CY-01, FRAG-ENABLER-0830-1-US-CY-02, FRAG-SQUADRON-0901-ENTIRE, FRAG-TOKEN-0901-1-ENTIRE]
    manufacturing_information_boundary: >-
      cyber-target-groups.md第6節及び第9節のruntime typeId、保存移行、UI及び実装手順をゲーム規範へ昇格させない。
    original_decided_at: "2026-09-27"
    reconfirmed_at: "2026-09-27"
    registered_at: "2026-09-27"
    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-TURN-BASE-STAR-PAYMENT-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - ターン基本★は①から★1又は②から★2のいずれかで支払い、①と②を混合しない。
      - ②から支払えるのは②合計が★8以上の場合に限る。
      - ②から支払うプレイヤーは、中止する次ATO準備を選択する。
      - ★2単位の準備では準備全体を取り消し、対応する★2を②から③へ移す。
      - スコードロン準備では中止するスコードロンプレート準備をプレイヤーが選択する。
      - イネーブラー、ADA弾補給、基地復旧は正式source及び既存Rule Coreの管理粒度を超えて細分化しない。
      - 分散配置準備は★3で一体であり、選択時は基本支払いの★2に加えて残余★1も③へ移し、準備全体を取り消す。
      - A1処理後も②合計は★6以上でなければならない。②=★8では★2準備のみ選択でき、②>=★9で★3分散配置準備を選択できる。
    scope: "ターン基本★の支払元、取消準備のプレイヤー選択、分散配置準備の全取消し及び処理後②最低★6"
    affected_rule_core_ids: [RC-TURN-BASE-STAR-PAYMENT-001]
    source_relationship: >-
      SRC-RULE-0910-2-PDF p.8は①から★1又は②から★2を③へ移すこと、②支払には②合計★8以上を要すること、
      パスには支払い不要であることを定める。取消対象準備の選択、★3分散配置準備の残余★1及び処理後最低★6を
      一意に定めないため、本追加裁定がその範囲を補う。
    normative_information:
      - "①★1又は②★2の排他的な支払元"
      - "中止する次ATO準備のプレイヤー選択"
      - "分散配置準備選択時は★3全てを③へ移し準備全体を取消"
      - "処理後②最低★6"
    source_ids: [SRC-RULE-0910-2-PDF]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-TURN-BASE-STAR]
    original_decided_at: "2026-09-27"
    reconfirmed_at: "2026-09-27"
    registered_at: "2026-09-27"
    approved_by: ルール所有者
    status: approved
