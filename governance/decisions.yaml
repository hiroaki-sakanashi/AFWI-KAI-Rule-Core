  - decision_id: DEC-SQUADRON-ACTIVATION-VISIBILITY-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - 管理陣営は、Component ID、プレート、生成予定数、★、基地状態、D4、実生成数、地上断念、token ID、生成位置をすべて知る。
      - 相手陣営にも、activationが行われたこと、生成予定数、必要・支払★、D4結果、実生成数、地上断念数、生成されたtoken数及び盤上位置、処理完了を公開する。
      - 基地群の出撃キャパシティ、航空運用インフラ被害、整備補給基盤被害は両陣営に公開する。
      - 未捕捉スコードロンについて、Component ID、プレートの正体、個別tokenと出所プレートの対応は管理陣営だけが知る。
      - 相手陣営へのスコードロンの正体の開示は、既存のSTATE-SQUADRON-ACQUIRED及び捕捉・インテル規則に従う。
      - EVENT-SQUADRON-TOKENS-GENERATEDでは、相手陣営へtoken数と配置hexを公開するが、未捕捉である間はComponent ID、plate ID及び出所対応を開示しない。
      - 通常帰還では、token数、帰還元hex及び帰還処理の発生を公開するが、未捕捉tokenのComponent IDと出所プレートは開示しない。
      - Digital内部のcontinuation、stack、resume tokenはRule Coreの公開状態に含めない。
    scope: "スコードロン配備、activation、generation、地上断念、token配置及び通常帰還のfield-level visibility"
    affected_rule_core_ids: [RC-SQUADRON-DEPLOYMENT-001, RC-SQUADRON-ACTIVATION-001, RC-SQUADRON-GENERATION-001, RC-SQUADRON-RETURN-001]
    applies_to_component_ids: [COMP-SQUADRON-STC-SQ-04, COMP-SQUADRON-STC-SQ-13]
    source_relationship: >-
      SRC-RULE-0910-2-PDF、SRC-BOARD-A3-0915、SRC-BOARD-A4-0815-01、SRC-SQUADRON-0901及びSRC-TOKEN-0901-1は
      activation、生成、基地状態及び物理コンポーネントを定めるが、陣営別のfield-level visibilityを十分に定めない。
      本追加裁定は規則内容を変更せず、管理陣営と相手陣営のknowledge境界だけを補う。
    normative_information:
      - "管理陣営はactivation及びgenerationの全規範fieldを知る"
      - "相手陣営にはactivation発生、予定数、必要・支払★、D4結果、実生成数、地上断念数、生成token数・位置、完了を公開"
      - "基地群出撃キャパシティ、航空運用インフラ被害、整備補給基盤被害は両陣営へ公開"
      - "未捕捉時のComponent ID、plate identity、個別token IDと出所plate対応は管理陣営限定"
      - "正体開示はSTATE-SQUADRON-ACQUIRED及び捕捉・インテル規則に従う"
      - "通常帰還はtoken数、帰還元hex、発生を公開し、未捕捉identityと出所対応は非公開"
      - "Digital内部continuation、stack、resume tokenは規範公開状態ではない"
    source_ids: [SRC-RULE-0910-2-PDF, SRC-RULE-0910-2-DOCX, SRC-BOARD-A3-0915, SRC-BOARD-A4-0815-01, SRC-SQUADRON-0901, SRC-TOKEN-0901-1]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P8-9-SQUADRON-ACTIVATION, FRAG-RULE-0910-2-DOCX-P184-192-SQUADRON-ACTIVATION, FRAG-BOARD-A3-0915-ENTIRE, FRAG-BOARD-A4-0815-01-ENTIRE, FRAG-SQUADRON-0901-P2-STC-SQ-04, FRAG-SQUADRON-0901-P3-STC-SQ-13, FRAG-TOKEN-0901-1-P5-6-KJ-500, FRAG-TOKEN-0901-1-P5-6-KQ-200]
