    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-ENABLER-NV-MULTIPLE-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - 同じBLUE艦の同じ移動終了が両カードの条件を満たす場合、REDはSTC-NV-07とSTC-NV-08の両方を使用できる。
      - 使用・解決順はREDプレイヤーが決める。
      - STC-NV-07とSTC-NV-08の潜水艦攻撃について、BLUE艦へ与えるヒット数の期待値は、どちらを先に解決しても変わらない。
      - ただし、カードは一括して発動・消費せず、REDが選んだ順に1枚ずつ使用・解決する。
      - 先の潜水艦攻撃で対象BLUE艦が撃破・除去された場合、後続カードは未発動扱いとする。
      - 未発動となった後続カードは手札に残す。
      - 未発動となった後続カードに対応する兆候マーカーも盤上に残す。
      - 後続カードの使用回数は消費しない。
      - 対象艦が存在しないため、後続攻撃は実行しない。
      - 先に使用したカードは使用済みとなり、それに対応する兆候マーカーはカード記載どおり処理される。
      - REDがSTC-NV-07とSTC-NV-08のどちらを先に解決するかによって、対象艦撃破後にどちらのカードと兆候マーカーが残るかが変わり、ゲーム上の状態に差異が生じ得る。
      - 解決順はREDプレイヤーが決定するため、これはREDプレイヤーにとって実質的な選択である。
    scope: "同じBLUE艦の同じ移動終了でSTC-NV-07とSTC-NV-08がともに成立する場合の選択権、逐次解決及び対象消失時の後続カード処理"
    affected_rule_core_ids: [RC-ENABLER-IMMEDIATE-001]
    applies_to_component_ids: [COMP-ENABLER-STC-NV-07, COMP-ENABLER-STC-NV-08]
    source_relationship: >-
      SRC-ENABLER-0830-1の両カードは同じtrigger、対象及び攻撃処理を個別に定めるが、両方が同時に成立した場合の
      複数使用、順序決定、逐次発動及び先行攻撃で対象が失われた場合の後続カード状態を定めない。本追加裁定がその範囲を補う。
    normative_information:
      - "両カードは同じ移動終了に対して使用可能"
      - "REDが使用・解決順を選ぶ"
      - "カードは選択順に1枚ずつ使用・解決する"
      - "後続発動前に対象艦の存在を再確認する"
      - "対象艦が除去済みなら後続カードは未発動、手札維持、マーカー維持、使用回数不消費、攻撃不実行"
      - "先行カードは使用済みとなり、対応する兆候マーカーはカード記載どおり処理する"
      - "ヒット数の期待値は順序で変わらないが、対象艦除去後に残るカードと兆候マーカーは順序により変わり得る"
    rationale: "両攻撃のBLUE艦へ与えるヒット数の期待値は順序で変わらない。一方、1枚目で対象艦が除去されると2枚目は未発動となるため、どちらのカードと兆候マーカーが残るかは順序により変わり、ゲーム状態に差異が生じ得る。よって順序はREDプレイヤーの実質的な選択である。"
    correction_history:
      - corrected_at: "2026-09-24"
        corrected_by: ルール所有者
        correction_scope: "攻撃順とヒット数の期待値、カード・兆候マーカー残存状態の区別"
        reason: "攻撃のヒット数の期待値と、対象艦除去後に残るカード・兆候マーカーによるゲーム状態を区別するため。"
        effect_on_resolution_rule: none
    source_ids: [SRC-ENABLER-0830-1]
    source_fragment_ids: [FRAG-ENABLER-0830-1-STC-NV-07, FRAG-ENABLER-0830-1-STC-NV-08]
    original_decided_at: "2026-09-24"
    reconfirmed_at: "2026-09-24"
    registered_at: "2026-09-24"
    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-ENABLER-CYBER-COUNTER-SCOPE-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - 判定を持たないサイバー関連カードに対して、効果が生じないサイバー対抗カードを使用することはできない。
      - 効果のないカードは合法な選択肢として提示しない。
      - 使用回数を意図的に消費する目的でも使用できない。
      - 不適格なカードは手札または利用可能状態を維持し、使用回数を消費しない。
      - Day1及びDay2では、US-CY-05によりUS-CY-01の判定が自動成功となる。
      - 自動成功はDIS化の対象にならない。
      - したがってDay1及びDay2では、STC-CY-04はUS-CY-05への合法な対抗選択肢にならない。
      - Day3以降では、US-CY-05がUS-CY-01判定をADVにする。
      - STC-CY-04は同じUS-CY-01判定をDISにする。
      - ADVとDISは相殺し、通常のD4判定になる。
      - Day3以降にSTC-CY-04を使用した場合は、その使用回数を通常どおり消費する。
    scope: "判定を対象とするサイバー対抗カードの合法性と、ミュトスに対するサイバーカウンターメジャーのDay別処理"
    affected_rule_core_ids: [RC-ENABLER-IMMEDIATE-001]
    applies_to_component_ids: [COMP-ENABLER-STC-CY-04, COMP-ENABLER-US-CY-03, COMP-ENABLER-US-CY-05]
    source_relationship: >-
      SRC-ENABLER-0830-1は判定がないカードには対抗効果がないこと、ミュトスのDay別効果及び
      サイバーカウンターメジャーのDIS効果を定めるが、効果のない使用の合法性と相互作用の範囲を十分に定めない。
      本追加裁定がその範囲を補う。
    normative_information:
      - "判定を持たないサイバー関連カードに効果のない対抗カードは使用不可"
      - "不適格カードは合法候補へ提示せず、手札又は利用可能状態と使用回数を維持"
      - "Day1・Day2のミュトスによる自動成功はDIS化対象外でサイバーカウンターメジャーは使用不可"
      - "Day3以降は同じUS-CY-01判定へのADVとDISが相殺して通常D4"
      - "Day3以降の合法なサイバーカウンターメジャー使用は使用回数を消費"
    source_ids: [SRC-ENABLER-0830-1]
    source_fragment_ids: [FRAG-ENABLER-0830-1-STC-CY-04, FRAG-ENABLER-0830-1-US-CY-03, FRAG-ENABLER-0830-1-US-CY-05]
    original_decided_at: "2026-09-24"
    reconfirmed_at: "2026-09-24"
    registered_at: "2026-09-24"
    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-ENABLER-US-AF-10-MD-TIMING-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - BLUE航空機がADAを攻撃する場合、BLUEによるUS-AF-10の使用判断・使用宣言を先に行う。
      - その後、REDがMDを宣言するか判断する。
      - REDはUS-AF-10が使用されたか否かを知った状態でMD判断を行う。
      - REDがMDを宣言した場合、その後にUS-EW-03の応答機会が生じる。
      - 処理順は次のとおり。

      1. ADAへの攻撃を宣言
      2. BLUEがUS-AF-10を使用するか判断
      3. 使用する場合はUS-AF-10を宣言
      4. REDがMDを使用するか判断
      5. REDがMDを宣言した場合、BLUEにUS-EW-03の応答機会
      6. MD処理
      7. 未解決であれば、US-AF-10のADVを反映して攻撃処理へ進む
    scope: "BLUE航空機によるADA攻撃でのUS-AF-10判断、RED MD判断、US-EW-03応答、MD解決及び攻撃復帰の順序"
    affected_rule_core_ids: [RC-ENABLER-IMMEDIATE-001, RC-COMBAT-MD-001, RC-COMBAT-MD-RESOLUTION-001]
    applies_to_component_ids: [COMP-ENABLER-US-AF-10, COMP-ENABLER-US-EW-03]
    source_relationship: >-
      SRC-ENABLER-0830-1はUS-AF-10とUS-EW-03の個別triggerを、SRC-RULE-0910-2-PDF p.12はMD判断と解決を定めるが、
      BLUE航空機のADA攻撃におけるUS-AF-10とMD判断の先後及びMD後の攻撃復帰を十分に定めない。本追加裁定がその順序を補う。
    normative_information:
      - "ADA攻撃宣言後、BLUEがUS-AF-10使用を先に判断"
      - "REDはUS-AF-10使用・不使用を知ってからMDを判断"
      - "REDのMD宣言後にBLUEのUS-EW-03応答機会"
      - "MD解決後に攻撃が未解決ならUS-AF-10のADVを維持して攻撃へ復帰"
    source_ids: [SRC-RULE-0910-2-PDF, SRC-ENABLER-0830-1]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P12-MD, FRAG-ENABLER-0830-1-US-AF-10, FRAG-ENABLER-0830-1-US-EW-03]
    original_decided_at: "2026-09-24"
    reconfirmed_at: "2026-09-24"
    registered_at: "2026-09-24"
    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-RATE-BOUNDARY-001
    category: addition
    decision_type: additional
    owner_final_text: |-
      - US宇宙レート、PRC宇宙レート、USサイバーレート、PRCサイバーレートは0から4まで、共有戦略レートはPRC優勢6から中央0を経てUS優勢6までの実値だけを保持する。
      - `4+`及び`6+`は表示上の端点であり、端点を越えた隠れた値や同方向への余剰変更量を保持しない。変更後の値は必ず表示範囲内へ制限する。
      - 戦略レートの端点6は実際の現在値である。反対方向への変更は6を起点に変更量を差し引き、両陣営方向へ対称的に適用する。
      - 任意選択効果の唯一の効果が端点と同方向へのレート変更で実値を変えない場合、その効果を合法候補として提示せず、宣言、判定、使用回数消費、公開・捨て札・除外・山札戻し等の使用後処理、`EVENT-RATE-CHANGED`を行わない。不正な直接Commandも状態不変で拒否する。
      - 強制変更が端点と同方向である場合、起点となる強制処理は解決済みとするが、値は端点に留め、超過量を保持せず、`EVENT-RATE-CHANGED`及び実際のレート変更を条件とする後続triggerを発生させない。強制処理自体の別Eventは維持する。
      - 複数の独立効果を持つカードは、少なくとも一つの効果が実際に状態を変更できれば使用可能とする。各効果を個別評価し、端点で変化しないレート部分には`EVENT-RATE-CHANGED`を発生させず、他の有効な効果は通常どおり処理する。
      - サイバーレート0でSTC-CY-05が元の上昇を取り消せる場合、カードは使用可能である。元の上昇を取り消し、その後の追加-1は下限0で止め、最終値を0とし、カードの使用状態を通常どおり更新する。起点の上昇取消しと追加低下を区別して記録し、追加低下部分で値が変わらない場合は新しい`EVENT-RATE-CHANGED`を発生させない。
      - サイバーレート4のATO終了時効果と共有戦略レート6のATO終了時効果は維持する。戦略レートの更迭はATO終了時の実値で判定し、ATO終了前に6から反対方向へ移動した場合、一度6へ到達した履歴だけでは更迭しない。
    scope: "全5 Rate IDの表示端点、実値制限、任意・強制・複数効果の境界処理、STC-CY-05及びATO終了時端点判定"
    affected_rule_core_ids: [RC-RATE-BOUNDARY-001, RC-RATE-CYBER-INCREASE-001, RC-RATE-STRATEGIC-END-001]
    applies_to_component_ids: [COMP-ENABLER-STC-CY-05, COMP-ENABLER-US-SP-03, COMP-ENABLER-US-IW-04, COMP-ENABLER-STC-IW-04]
    applies_to_rate_ids: [RATE-SPACE-US, RATE-SPACE-PRC, RATE-CYBER-US, RATE-CYBER-PRC, RATE-STRATEGIC]
    source_relationship: >-
      正式ルール、A3ボード及びイネーブラーカードは各レートの表示範囲、端点効果、変更方向及び変更量を定めるが、
      端点と同方向への変更要求の合法性、消費、超過値、Event及び後続triggerを十分に定めない。本追加裁定がその範囲だけを補う。
    normative_information:
      - "全5レートの実値は表示範囲へ制限し、隠れた超過値を保持しない"
      - "値を変えない単独任意効果は不適格で、宣言・判定・消費・使用後処理を行わない"
      - "値を変えない強制変更は起点処理のみ解決し、レート変更Eventと後続triggerを生じない"
      - "複数効果は各効果を個別評価し、少なくとも一つが状態を変えられればカードを使用できる"
      - "STC-CY-05の取消しと追加低下を分離し、0での追加低下は値不変Eventを生じない"
      - "端点効果はATO終了時の実値で判定する"
