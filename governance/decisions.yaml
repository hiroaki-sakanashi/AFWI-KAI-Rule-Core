    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-COMBAT-MD-DICE-001
    category: correction
    owner_final_text: >-
      MD判定にはD4を使用する。ADAおよびMD艦艇に置くD6は対空残弾数を示すカウンターであり、MD判定では振らない。
    scope: "MD判定用ダイスと、ADA・MD艦艇の対空残弾表示用D6の役割分離"
    affected_rule_core_ids: [RC-COMBAT-MD-001, RC-COMBAT-MD-RESOLUTION-001, RC-COMBAT-MD-LAYERED-001]
    source_relationship: >-
      SRC-RULE-0910-2-PDF p.12はMD結果を出目4、MD値以上4未満、MD値未満として定義し、
      SRC-TOKEN-0901-1のADA・MD艦艇現物はMD値と対空弾薬の資源表示を担う。
      物理的なD6が残弾表示用であり判定には使わないという境界は正式資料だけでは明示が十分でないため、本訂正裁定が補う。
    normative_information:
      - "MD判定の乱数はD4"
      - "出目4は完全迎撃"
      - "MD判定値以上4未満は部分迎撃"
      - "MD判定値未満は失敗"
      - "ADAおよびMD艦艇の対空残弾は整数の資源状態"
      - "物理的なD6は対空残弾表示用カウンターであり、判定では振らない"
    manufacturing_information_boundary: >-
      D6という物理表示方法をDigitalの実装要件にしない。Digitalは対空残弾数を整数状態として保持し、
      残弾表示用D6をfixed_randomness、roll又はrandom inputとして扱わない。
    source_ids: [SRC-RULE-0910-2-PDF, SRC-TOKEN-0901-1]
    source_fragment_ids: [FRAG-RULE-0910-2-PDF-P12-MD, FRAG-TOKEN-0901-1-ENTIRE]
    original_decided_at: unknown
    reconfirmed_at: "2026-09-23"
    registered_at: "2026-09-23"
    approved_by: ルール所有者
    status: approved

  - decision_id: DEC-EMI-COMPONENT-001
    category: addition
    owner_final_text: >-
      SRC-EMI-0811を現在の正式なEMIコンポーネント資料とする。実際のEMIコンポーネントは、
      マップ上の1ヘックスと全く同じ大きさの六角形半透明ボードへ対応するEMIシールを貼ったもので、
      BLUE用1個とRED用1個の独立した完成コンポーネントである。PDF上のtop/bottomは印刷・製作用の配置にすぎず、
      ゲーム上の上下関係、配置順、優先順位、表裏関係、1個の両面コンポーネント、または2個を重ねることを意味しない。
      1ヘックスと同じ大きさ、六角形、半透明、各陣営1個、対応シールによる識別はゲーム上のコンポーネント仕様とする。
      シールの印刷、切り抜き、貼付方法など、合法手、対象範囲、効果または判定に影響しない製作手順はルール本文へ含めない。
    scope: "EMI物理コンポーネントの形状、占有・表示単位、表示特性、個数、陣営別識別、独立性"
    affected_rule_core_ids: [RC-EMI-COMPONENT-001]
    applies_to_component_ids: [COMP-EMI-BLUE, COMP-EMI-RED]
    source_relationship: >-
      SRC-EMI-0811はBLUE/REDシールの識別表示と印字内容を提供する。
      元PDFだけでは確定できない完成物の形状、寸法、半透明性、個数、独立性、top/bottomの非ゲーム属性を本追加裁定が補う。
    normative_information:
      - "陣営はBLUEまたはRED"
      - "完成物の形状は六角形"
      - "占有・表示単位はマップ上の1ヘックスと全く同じ大きさ"
      - "表示特性は半透明"
      - "各陣営1個"
      - "対応するEMIシールで識別"
      - "BLUE用とRED用は別々の物理コンポーネント"
    manufacturing_information_boundary: >-
      PDF上のtop/bottomはsource fragmentの位置情報に限る。シールの印刷、切り抜き、貼付方法その他、
      ゲーム上の合法手、対象範囲、効果または判定へ影響しない製作手順はRule Coreのルール本文へ入れない。
    source_ids: [SRC-EMI-0811]
    source_fragment_ids: [FRAG-EMI-0811-BLUE-COMPONENT, FRAG-EMI-0811-RED-COMPONENT]
